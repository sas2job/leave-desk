name: Audit pre-reset history

on:
  workflow_dispatch:
    inputs:
      archive_timestamp:
        description: UTC backup timestamp before the demo reset (YYYYMMDDTHHMMSSZ)
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit retained historical archive in isolated PostgreSQL
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          AUDIT_ARCHIVE_TIMESTAMP: ${{ inputs.archive_timestamp }}
        run: bash deploy/audit-pre-reset-backup.sh
