name: Correct demo calendar 2026

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Correct annual leave or demo birthdays
        type: choice
        options: [vacations, birthdays, calendar_2027]
        default: vacations
        required: true
      mode:
        description: Preview or apply the 2026 demo correction
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      plan_digest:
        description: SHA-256 returned by the plan (required for apply)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-24.04
    environment: production
    env:
      OPERATION: ${{ inputs.operation }}
      MODE: ${{ inputs.mode }}
      PLAN_DIGEST: ${{ inputs.plan_digest }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate operation
        run: |
          case "$OPERATION" in vacations|birthdays|calendar_2027) : ;; *) exit 64 ;; esac
          case "$MODE" in
            plan) test -z "$PLAN_DIGEST" ;;
            apply) [[ "$PLAN_DIGEST" =~ ^[a-f0-9]{64}$ ]] ;;
            *) exit 64 ;;
          esac
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Back up and verify before applying
        if: inputs.mode == 'apply'
        run: |
          backup_output=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' < deploy/backup-before-demo-correction.sh)
          printf '%s\n' "$backup_output"
          printf '%s\n' "$backup_output" | grep -Eq \
            '^Correction backup verified: /var/backups/leave-desk/demo-2026-before-correction-[[:alnum:]]{8}$'
      - name: Preview or apply correction
        run: |
          case "$OPERATION" in
            vacations) correction_script=script/correct_demo_calendar_2026.rb ;;
            birthdays) correction_script=script/correct_demo_birthdays.rb ;;
            calendar_2027) correction_script=script/seed_staging_calendar_2027.rb ;;
          esac
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /root/projects/leave-desk && ./current/compose.sh exec -T \
            -e DEMO_CALENDAR_MODE='$MODE' -e DEMO_CALENDAR_PLAN_DIGEST='$PLAN_DIGEST' \
            web bin/rails runner -" < "$correction_script"
      - name: Check leave history
        if: inputs.mode == 'apply'
        run: bash deploy/audit-leave-history.sh
      - name: Check public HTTPS
        if: inputs.mode == 'apply'
        run: curl --fail --silent --show-error --max-time 15 https://leave-desk.duckdns.org/up
