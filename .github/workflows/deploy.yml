name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout trusted deployment gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Read current main revision
        if: github.event_name == 'workflow_run'
        id: main_tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Authorize deployment revision
        id: gate
        env:
          MAIN_TIP_SHA: ${{ steps.main_tip.outputs.sha }}
        run: ruby bin/deploy-gate

  deploy:
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout authorized revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.authorize.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.authorize.outputs.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish deployment configuration atomically
        env:
          REVISION: ${{ needs.authorize.outputs.sha }}
          RELEASE_ID: ${{ needs.authorize.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          deployment_root=/root/projects/leave-desk
          staging_directory="$deployment_root/.incoming/$RELEASE_ID"
          release_files=(
            Caddyfile apply-caddy.sh backup.sh compose.sh compose.yml
            leave-desk-backup.service leave-desk-backup.timer
            leave-desk-cache-cleanup.service leave-desk-cache-cleanup.timer
            leave-desk-session-prune.service leave-desk-session-prune.timer
            publish-release.sh
          )

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; umask 077; mkdir -p '$deployment_root/.incoming';
             test ! -e '$staging_directory'; mkdir '$staging_directory'"

          manifest="$RUNNER_TEMP/leave-desk-$RELEASE_ID.SHA256SUMS"
          (cd deploy && sha256sum "${release_files[@]}") > "$manifest"
          scp -P "$DEPLOY_PORT" "${release_files[@]/#/deploy/}" \
            "$DEPLOY_USER@$DEPLOY_HOST:$staging_directory/"
          scp -P "$DEPLOY_PORT" "$manifest" \
            "$DEPLOY_USER@$DEPLOY_HOST:$staging_directory/SHA256SUMS"

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; sh '$staging_directory/publish-release.sh' '$deployment_root'
               '$staging_directory' '$RELEASE_ID' '$IMAGE_NAME:$REVISION'"

      - name: Deploy tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin; \
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; \
            cd /root/projects/leave-desk; \
            ./current/compose.sh pull web migrate; \
            ./current/compose.sh run --rm migrate; \
            ./current/compose.sh up -d --no-deps web; \
            ./current/apply-caddy.sh; \
            health_host=\$(sed -n 's/^LEAVE_DESK_PUBLIC_HOST=//p' .env); \
            test -n \"\$health_host\"; \
            for attempt in \$(seq 1 30); do \
              curl --fail --silent --show-error --header \"Host: \$health_host\" \
                http://127.0.0.1:3000/up && exit 0; \
              sleep 2; \
            done; \
            ./current/compose.sh logs --tail=100 web; \
            exit 1"
      - name: Check public HTTPS
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 --max-time 10 "https://$DEPLOY_HOST/up"
