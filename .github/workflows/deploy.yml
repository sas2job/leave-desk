name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Select tested commit
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update deployment configuration
        run: |
          scp -P "$DEPLOY_PORT" deploy/compose.yml deploy/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:/root/projects/leave-desk/"

      - name: Deploy tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; \
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin; \
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; \
            cd /root/projects/leave-desk; \
            sed -i 's|^LEAVE_DESK_IMAGE=.*|LEAVE_DESK_IMAGE=$IMAGE_NAME:$REVISION|' .env; \
            docker compose pull web migrate; \
            docker compose run --rm migrate; \
            docker compose up -d --no-deps web; \
            health_host=\$(sed -n 's/^LEAVE_DESK_PUBLIC_HOST=//p' .env); \
            test -n \"\$health_host\"; \
            for attempt in \$(seq 1 30); do \
              curl --fail --silent --show-error --header \"Host: \$health_host\" \
                http://127.0.0.1:3000/up && exit 0; \
              sleep 2; \
            done; \
            docker compose logs --tail=100 web; \
            exit 1"
